name: iOS Build

on:
  workflow_dispatch:
  # P017 review-only native verification: this trigger cannot publish releases.
  pull_request:
    branches: [ios/upstream-v021-integration]
    paths:
      - ".github/workflows/ios-build.yml"
      - ".github/workflows/p017-release-candidate.yml"
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "internal/site/**"
      - "tests/**"
      - "scripts/audit/**"
      - "patches/go/**"
      - "install.sh"
      - "scripts/ios/**"
      - "docs/ios-p019-*"
      - "docs/ios-p020-*"
      - "docs/ios-p021-*"
      - "docs/ios-p022-*"
      - "docs/ios-release-candidate*"
  push:
    branches:
      - iOS
      - ios/procursus-package-updates
      - ios/wifi-rssi-compatibility
      - ios/hub-database-migration
    # NOTE: path filters are NOT evaluated for tag pushes by GitHub Actions,
    # so iOS release tags always run the full build + release pipeline below,
    # while branch pushes to `iOS` still skip docs-only changes.
    tags:
      - "v*-ios.*"
    paths:
      - "*.go"
      - "**/*.go"
      - "internal/site/**"
      - "go.mod"
      - "go.sum"
      - "go.work"
      - "go.work.sum"
      - ".github/workflows/ios-build.yml"
      - ".github/scripts/**"
      - "scripts/audit/ios_wifi/native.py"
      - "tools/ios-wifi-probe/**"
      - "docs/ios-wifi-rssi-*"
      - "docs/ios-wifi-native-blocker-resolution*"
      - "docs/upstream-v021-acceptance*"
      - "docs/upstream-v021-risk-register.*"
      - "docs/ios-hub-*"
      - "tests/hub-migration/**"
      - "tests/audit/**"
      - "tests/ios-patch-sentinels.sh"
      - "tests/upstream-sync-test.sh"

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  procursus-package-updates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      BESZEL_REQUIRE_OFFLINE_APT_SANDBOX: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download Go modules for offline sandbox test
        run: go mod download

      - name: Test Procursus detection, parser, and network-disabled read-only query
        shell: bash
        run: |
          set -euo pipefail
          module_cache="$(go env GOMODCACHE)"
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,exec,nosuid,size=6g \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/workspace,readonly" \
            --mount "type=bind,src=$module_cache,dst=/go/pkg/mod,readonly" \
            --workdir /workspace \
            --env GOTOOLCHAIN=local \
            --env GOPROXY=off \
            --env GOSUMDB=off \
            --env GOCACHE=/tmp/go-build-cache \
            --env HOME=/tmp/home \
            --env TMPDIR=/tmp \
            --env BESZEL_APT_QUERY_ISOLATED=1 \
            --env BESZEL_REQUIRE_OFFLINE_APT_SANDBOX=1 \
            --env BESZEL_HEALTH_DIR=/tmp/beszel-health \
            golang:1.27.2-bookworm bash -euo pipefail -c '
              mkdir -p "$HOME" "$GOCACHE" "$BESZEL_HEALTH_DIR"
              test "$(go env GOVERSION)" = go1.27.2
              go version
              go test -race -v -tags "testing no_ui" ./agent \
                -run "Test(DetectProcursusAPT|ParseProcursusAPT|ProcursusAPT|CompareDpkgVersions|CheckProcursusAPT)" \
                -count=3 -timeout=180s
            '

  build-ios:
    runs-on: macos-14
    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Run iOS maintenance sentinels
        shell: bash
        run: |
          set -euo pipefail
          sh tests/ios-patch-sentinels.sh
          sh tests/upstream-sync-test.sh

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Test native build validators
        run: python3 -m unittest discover -s tests/audit -p 'test_*.py' -v

      - name: Build and test real web UI
        working-directory: internal/site
        shell: bash
        run: |
          set -euo pipefail
          shasum -a 256 bun.lock > "$RUNNER_TEMP/bun-lock-before"
          bun install --frozen-lockfile
          bun run sync
          bun test
          bun run build
          shasum -a 256 -c "$RUNNER_TEMP/bun-lock-before"
          # Retain genuine dist and compiled catalogs; exclude generated PO text.
          git restore -- src/locales
          git diff --exit-code

      - name: Verify iOS, macOS and Linux source selection
        run: python3 .github/scripts/check-ios-source-selection.py --output "$RUNNER_TEMP/source-selection.json"

      - name: Test portable telemetry and macOS regressions
        shell: bash
        run: |
          set -euo pipefail
          env -u NETWORK go test -tags 'testing no_ui' ./agent ./agent/battery ./agent/deltatracker ./internal/entities/system
          env -u NETWORK go test -race -tags 'testing no_ui' ./agent ./agent/battery ./agent/deltatracker ./internal/entities/system -run 'Test(P008|IOSBattery|CalculateHostMemory|CpuMetrics|GetAllBusy|Disk|SumAndTrack|SkipNetwork|Serialization|Battery|Primary|Normalize)' -count=1
          env -u NETWORK go test -race -tags 'testing no_ui' ./agent/health ./internal/cmd/agent -count=3

      - name: Test disabled native Wi-Fi diagnostic and public CF ownership
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit/ios_wifi/native.py --host --output "$RUNNER_TEMP/wifi-host" --revision "$(git rev-parse HEAD)"
          cp "$RUNNER_TEMP/wifi-host/validation.json" "$RUNNER_TEMP/wifi-host-validation.json"
          BESZEL_WIFI_PROBE_TEST_PATH="$RUNNER_TEMP/wifi-host/beszel-ios-wifi-probe" \
            env -u NETWORK go test -race -v ./agent/wifi/ioshelper -count=3 -timeout=180s

      - name: Test iOS Wi-Fi unavailable adapter and shared telemetry contracts
        shell: bash
        run: |
          set -euo pipefail
          # Explicit files execute the production iOS fallback unchanged on
          # macOS; this does not simulate or claim MobileWiFi hardware access.
          env -u NETWORK go test -race -tags 'testing no_ui' \
            agent/wifi/wifi.go agent/wifi/wifi_ios.go \
            agent/wifi/wifi_test.go agent/wifi/wifi_ios_test.go -count=3
          env -u NETWORK go test -race -tags 'testing no_ui' ./agent/wifi ./agent ./internal/hub/transport ./internal/hub/systems \
            -run 'TestP012|TestCreateRecordsWiFi|TestFetchDataViaWebSocketDoesNotRetainOmittedFields' -count=3 -timeout=180s

      - name: Test transport faults and races
        shell: bash
        run: |
          set -euo pipefail
          env -u NETWORK go test -tags 'testing no_ui' ./agent ./internal/hub/ws ./internal/hub/transport ./internal/hub/systems ./internal/common
          env -u NETWORK go test -race -tags 'testing no_ui' ./agent ./internal/hub/ws ./internal/hub/transport ./internal/hub/systems
          env -u NETWORK go test -race -tags 'testing no_ui' ./agent ./internal/hub/ws ./internal/hub/transport -run TestP009 -count=3 -timeout=180s

      - name: Test network monitor compatibility and fault recovery
        shell: bash
        run: |
          set -euo pipefail
          env -u NETWORK go test -race -tags 'testing no_ui' ./agent ./internal/hub/transport -run TestP010 -count=3 -timeout=180s
          env -u NETWORK go test -race -tags 'testing no_ui' ./internal/hub ./internal/hub/systems -run 'Test.*NetworkMonitor|TestGenerateMonitorID|TestCopyMonitor' -count=1

      - name: Preserve macOS build and GPU parser tests
        shell: bash
        run: |
          set -euo pipefail
          go test ./agent -run 'Test.*(Powermetrics|Macmon)' -count=1
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=1 go build -trimpath -o "$RUNNER_TEMP/beszel-agent-macos" ./internal/cmd/agent
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=1 go build -trimpath -o "$RUNNER_TEMP/beszel-hub-macos" ./internal/cmd/hub

      - name: Show and verify environment
        shell: bash
        run: |
          set -euo pipefail
          go version
          bun --version
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --find clang
          test "$(go env GOVERSION)" = "go$(awk '$1 == "go" {print $2}' go.mod)"

      - name: Patch isolated Go runtime for legacy iOS ARM64
        shell: bash
        run: |
          set -euo pipefail
          source_goroot="$(go env GOROOT)"
          patched_goroot="$RUNNER_TEMP/go-ios-a7"
          test ! -e "$patched_goroot"
          mkdir "$patched_goroot"
          cp -R "$source_goroot/." "$patched_goroot/"
          chmod -R u+w "$patched_goroot"
          shasum -a 256 "$source_goroot/src/runtime/asm_arm64.s" > "$RUNNER_TEMP/original-runtime.sha256"
          export GOROOT="$patched_goroot" GOTOOLCHAIN=local
          export PATH="$GOROOT/bin:$PATH"
          test "$(go env GOROOT)" = "$patched_goroot"
          test "$(go env GOVERSION)" = "go$(awk '$1 == "go" {print $2}' go.mod)"
          python3 .github/scripts/patch-go-ios-arm64-runtime.py | tee "$RUNNER_TEMP/runtime-patch.json"
          shasum -a 256 -c "$RUNNER_TEMP/original-runtime.sha256"
          echo "GOROOT=$GOROOT" >> "$GITHUB_ENV"
          echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"
          echo "$GOROOT/bin" >> "$GITHUB_PATH"
          echo "GOCACHE=$RUNNER_TEMP/ios-go-cache" >> "$GITHUB_ENV"
          # Clear inherited host target/linker flags; share one device clang.
          echo "GOFLAGS=" >> "$GITHUB_ENV"
          echo "CGO_CFLAGS=-O2 -g" >> "$GITHUB_ENV"
          echo "CGO_CPPFLAGS=" >> "$GITHUB_ENV"
          echo "CGO_CXXFLAGS=-O2 -g" >> "$GITHUB_ENV"
          echo "CGO_LDFLAGS=" >> "$GITHUB_ENV"
          echo "GOOS=ios" >> "$GITHUB_ENV"
          echo "GOARCH=arm64" >> "$GITHUB_ENV"
          echo "GOARM64=v8.0" >> "$GITHUB_ENV"
          echo "CGO_ENABLED=1" >> "$GITHUB_ENV"
          echo "CC=$GITHUB_WORKSPACE/.github/scripts/ios-clang.sh" >> "$GITHUB_ENV"

      - name: Backport and test Go 1.27.2 x509 security fix
        shell: bash
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = go1.27.2
          python3 scripts/audit/patch-go-x509-security.py \
            --output "$RUNNER_TEMP/go-x509-security-backport.json"

      - name: Build separate disabled iOS Wi-Fi diagnostic and client compile fixture
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit/ios_wifi/native.py --ios --output "$RUNNER_TEMP/wifi-ios" --revision "$(git rev-parse HEAD)"
          go test -c -o "$RUNNER_TEMP/ios-wifi-client.test" ./agent/wifi/ioshelper

      - name: Build Beszel Agent and Hub twice with isolated caches
        shell: bash
        run: |
          set -euo pipefail
          test "$(go env GOROOT)" = "$RUNNER_TEMP/go-ios-a7"
          test "$(go env GOVERSION)" = "go$(awk '$1 == "go" {print $2}' go.mod)"
          go env GOOS GOARCH CGO_ENABLED CC CGO_CFLAGS CGO_LDFLAGS GOROOT GOTOOLCHAIN
          mkdir -p build/ios "$RUNNER_TEMP/ios-repeat"
          for binary in agent hub; do
            go build -trimpath -ldflags="-s -w" -o "build/ios/beszel-$binary-ios-arm64" "./internal/cmd/$binary"
            GOCACHE="$RUNNER_TEMP/ios-repeat-cache" go build -trimpath -ldflags="-s -w" -o "$RUNNER_TEMP/ios-repeat/beszel-$binary-ios-arm64" "./internal/cmd/$binary"
            cmp "build/ios/beszel-$binary-ios-arm64" "$RUNNER_TEMP/ios-repeat/beszel-$binary-ios-arm64"
            echo "PASS: two clean-cache $binary builds are byte-identical"
          done
          shasum -a 256 -c "$RUNNER_TEMP/original-runtime.sha256"

      - name: Inspect runtime instructions in unstripped validation builds
        shell: bash
        run: |
          set -euo pipefail
          for binary in agent hub; do
            go build -trimpath -o "$RUNNER_TEMP/beszel-$binary-validation" "./internal/cmd/$binary"
            python3 .github/scripts/verify-ios-runtime-binary.py "$RUNNER_TEMP/beszel-$binary-validation" --output "$RUNNER_TEMP/runtime-$binary.json"
          done

      - name: Inspect native Mach-O outputs
        shell: bash
        run: |
          set -euo pipefail
          for bin in build/ios/beszel-agent-ios-arm64 build/ios/beszel-hub-ios-arm64; do
            file "$bin" | grep -q "Mach-O 64-bit executable arm64"
            file "$bin"
            otool -hv "$bin"
            # Validator checks LC_BUILD_VERSION platform AND minos, or
            # LC_VERSION_MIN_IPHONEOS, requiring device iOS minimum 12.0.
            otool -l "$bin" | grep -A8 -E 'LC_BUILD_VERSION|LC_VERSION_MIN_IPHONEOS|LC_MAIN|LC_UNIXTHREAD'
          done

      - name: Verify unavailable Wi-Fi adds no private linkage
        shell: bash
        run: |
          set -euo pipefail
          for bin in build/ios/beszel-agent-ios-arm64 build/ios/beszel-hub-ios-arm64; do
            otool -L "$bin" >> "$RUNNER_TEMP/wifi-linkage.txt"
            nm -u "$bin" >> "$RUNNER_TEMP/wifi-linkage.txt"
          done
          cat "$RUNNER_TEMP/wifi-linkage.txt"
          if grep -E 'MobileWiFi|CoreWLAN|Apple80211|_WiFi(Manager|Device|Network)' "$RUNNER_TEMP/wifi-linkage.txt"; then
            echo 'ERROR: unavailable Wi-Fi must have no private imports' >&2
            exit 1
          fi

      - name: Generate and verify exact payload and frontend embedding
        shell: bash
        run: |
          set -euo pipefail
          (cd build/ios && shasum -a 256 beszel-agent-ios-arm64 beszel-hub-ios-arm64 > SHA256SUMS && shasum -a 256 -c SHA256SUMS)
          cat build/ios/SHA256SUMS
          python3 .github/scripts/verify-ios-artifacts.py build/ios --frontend internal/site/dist --expected-commit "$(git rev-parse HEAD)" --output "$RUNNER_TEMP/native-artifacts.json"
          sh tests/ios-macho-validation-test.sh build/ios/beszel-agent-ios-arm64 build/ios/beszel-hub-ios-arm64
          git diff --exit-code

      - name: Upload iOS review payload
        uses: actions/upload-artifact@v4
        with:
          name: beszel-ios-arm64
          if-no-files-found: error
          path: |
            build/ios/beszel-agent-ios-arm64
            build/ios/beszel-hub-ios-arm64
            build/ios/SHA256SUMS

      - name: Upload separate disabled Wi-Fi diagnostic review artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-wifi-diagnostic-disabled
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/wifi-ios/beszel-ios-wifi-probe
            ${{ runner.temp }}/wifi-ios/validation.json
            ${{ runner.temp }}/wifi-ios/linkage.txt
            ${{ runner.temp }}/wifi-host-validation.json

      - name: Upload native validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: ios-native-validation
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/source-selection.json
            ${{ runner.temp }}/runtime-patch.json
            ${{ runner.temp }}/go-x509-security-backport.json
            ${{ runner.temp }}/runtime-agent.json
            ${{ runner.temp }}/runtime-hub.json
            ${{ runner.temp }}/native-artifacts.json
            ${{ runner.temp }}/wifi-linkage.txt

  release-ios-validate:
    needs: build-ios
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-ios.')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.provenance.outputs.source_sha }}
      base_version: ${{ steps.provenance.outputs.base_version }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate iOS release tag format
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME:?GITHUB_REF_NAME is empty}"
          echo "Validating iOS release tag: ${TAG}"
          if [ ! -f beszel.go ]; then
            echo "ERROR: beszel.go not found at tag checkout" >&2
            exit 1
          fi
          BASE_VERSION="$(sed -n 's/^[[:space:]]*Version[[:space:]]*=[[:space:]]*"\(.*\)".*/\1/p' beszel.go | head -n 1)"
          if [ -z "${BASE_VERSION}" ]; then
            echo "ERROR: could not read beszel.Version from beszel.go" >&2
            exit 1
          fi
          echo "Base Beszel version from source: ${BASE_VERSION}"
          echo "BASE_VERSION=${BASE_VERSION}" >> "$GITHUB_ENV"
          ESCAPED_VERSION="$(printf '%s' "${BASE_VERSION}" | sed 's/\./\\./g')"
          EXPECTED_PATTERN="^v${ESCAPED_VERSION}-ios\\.[1-9][0-9]*$"
          if ! printf '%s' "${TAG}" | grep -Eq "${EXPECTED_PATTERN}"; then
            echo "ERROR: tag '${TAG}' does not match required format 'v${BASE_VERSION}-ios.<positive integer>'" >&2
            exit 1
          fi
          echo "Tag format OK: ${TAG}"

      - name: Verify tag belongs to iOS history
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME:?GITHUB_REF_NAME is empty}"
          TAG_SHA="$(git rev-list -n 1 "${TAG}")"
          echo "Tag ${TAG} points at ${TAG_SHA}"
          git fetch origin iOS --no-tags
          if git merge-base --is-ancestor "${TAG_SHA}" origin/iOS; then
            echo "Tag commit is in iOS branch history: OK"
          else
            echo "ERROR: tag ${TAG} (${TAG_SHA}) is not an ancestor of origin/iOS; refusing to release" >&2
            exit 1
          fi

      - name: Download iOS build artifact
        uses: actions/download-artifact@v4
        with:
          name: beszel-ios-arm64
          path: dist

      - name: Download same-run native provenance evidence
        uses: actions/download-artifact@v4
        with:
          name: ios-native-validation
          path: validation

      - name: Verify release payload, source and native provenance
        id: provenance
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          TAG_SHA="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          test "$TAG_SHA" = "$SOURCE_SHA"
          python3 .github/scripts/verify-ios-release-payload.py dist \
            --metadata validation/native-artifacts.json \
            --tag "$GITHUB_REF_NAME" \
            --source-sha "$SOURCE_SHA" \
            --output "$RUNNER_TEMP/ios-release-payload-validation.json"
          mkdir -p validated/payload
          cp dist/beszel-agent-ios-arm64 dist/beszel-hub-ios-arm64 dist/SHA256SUMS validated/payload/
          cp validation/native-artifacts.json validated/
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "base_version=$BASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload exact validated release payload for publisher job
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-validated-payload
          path: validated/
          if-no-files-found: error
          retention-days: 7

  release-ios:
    needs: release-ios-validate
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-ios.')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout release tag for the shared validator
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download validated same-run release payload
        uses: actions/download-artifact@v4
        with:
          name: ios-release-validated-payload
          path: validated

      - name: Revalidate publisher inputs
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.release-ios-validate.outputs.source_sha }}
          BASE_VERSION: ${{ needs.release-ios-validate.outputs.base_version }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          python3 .github/scripts/verify-ios-release-payload.py validated/payload \
            --metadata validated/native-artifacts.json \
            --tag "$GITHUB_REF_NAME" \
            --source-sha "$EXPECTED_SOURCE_SHA"

      - name: Create draft release after validation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME:?GITHUB_REF_NAME is empty}"
          BASE_VERSION="${BASE_VERSION:?BASE_VERSION is empty (tag validation must run first)}"
          NOTES_FILE="$RUNNER_TEMP/ios-release-notes.md"
          cat > "${NOTES_FILE}" <<EOF
          Beszel iOS ${TAG} - unofficial community port of Beszel, based on Beszel ${BASE_VERSION}.

          - Native Agent and Hub binaries for jailbroken iOS (arm64)
          - Hosted CI validates the iOS ARM64 build, runtime patch, checksums and embedded frontend
          - Physical device compatibility is not claimed by this release workflow; P018 Gate F requires separate acceptance
          - Verify checksums after download: run shasum -a 256 -c SHA256SUMS
          - Upstream Beszel: https://github.com/henrygd/beszel
          EOF
          gh release create "${TAG}" \
            --title "Beszel iOS ${TAG}" \
            --notes-file "${NOTES_FILE}" \
            --draft \
            --verify-tag \
            validated/payload/beszel-agent-ios-arm64 validated/payload/beszel-hub-ios-arm64 validated/payload/SHA256SUMS

      - name: Verify draft assets before publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME:?GITHUB_REF_NAME is empty}"
          DRAFT="$(gh release view "${TAG}" --json isDraft --jq .isDraft)"
          [ "${DRAFT}" = "true" ] || { echo "ERROR: release ${TAG} was not staged as a draft" >&2; exit 1; }
          ACTUAL="$(gh release view "${TAG}" --json assets --jq '.assets[].name' | sort)"
          EXPECTED="$(printf '%s\n' SHA256SUMS beszel-agent-ios-arm64 beszel-hub-ios-arm64 | sort)"
          [ "${ACTUAL}" = "${EXPECTED}" ] || { echo "ERROR: draft release assets do not match the validated payload" >&2; exit 1; }
          VERIFY_DIR="$RUNNER_TEMP/ios-release-draft-download"
          test ! -e "$VERIFY_DIR"
          mkdir -p "$VERIFY_DIR"
          gh release download "${TAG}" --dir "$VERIFY_DIR"
          python3 .github/scripts/verify-ios-release-payload.py "$VERIFY_DIR" \
            --metadata validated/native-artifacts.json \
            --tag "$TAG" \
            --source-sha "${{ needs.release-ios-validate.outputs.source_sha }}"

      - name: Publish verified draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME:?GITHUB_REF_NAME is empty}"
          gh release edit "${TAG}" --draft=false --latest

      - name: Verify published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME:?GITHUB_REF_NAME is empty}"
          REPO="${{ github.repository }}"
          gh release view "${TAG}" --json tagName,name,isDraft,isPrerelease,assets
          DRAFT="$(gh release view "${TAG}" --json isDraft --jq .isDraft)"
          PRERELEASE="$(gh release view "${TAG}" --json isPrerelease --jq .isPrerelease)"
          [ "${DRAFT}" = "false" ] || { echo "ERROR: release ${TAG} remains a draft" >&2; exit 1; }
          [ "${PRERELEASE}" = "false" ] || { echo "ERROR: release ${TAG} is marked prerelease" >&2; exit 1; }
          ACTUAL="$(gh release view "${TAG}" --json assets --jq '.assets[].name' | sort)"
          EXPECTED="$(printf '%s\n' SHA256SUMS beszel-agent-ios-arm64 beszel-hub-ios-arm64 | sort)"
          [ "${ACTUAL}" = "${EXPECTED}" ] || { echo "ERROR: published release assets differ from the validated payload" >&2; exit 1; }
          LATEST_TAG="$(gh api "repos/${REPO}/releases/latest" --jq .tag_name)"
          [ "${LATEST_TAG}" = "${TAG}" ] || { echo "ERROR: latest release is ${LATEST_TAG}, expected ${TAG}" >&2; exit 1; }
          echo "Release verification OK: ${TAG} is published, non-draft, non-prerelease, Latest, with 3 assets."
