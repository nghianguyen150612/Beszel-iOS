name: P013 Hub migration fixture

on:
  pull_request:
    branches: [ios/upstream-v021-integration]
    paths:
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - "internal/site/**"
      - "tests/hub-migration/**"
      - "tests/install-sh-test.sh"
      - "scripts/ios/install-beszel.sh"
      - "docs/ios-installer-rollback-evidence.md"
      - "docs/ios-hub-*"
      - "docs/ios-p021-*"
      - "docs/ios-p022-*"
      - "docs/ios-p023-*"
      - "docs/ios-wifi-rssi-*"
      - ".github/workflows/p013-hub-migration.yml"

permissions:
  contents: read

concurrency:
  group: p013-hub-migration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  genuine-hub-fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      BESZEL_HEALTH_DIR: ${{ github.workspace }}/.task/health
    steps:
      - name: Checkout exact feature source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Prepare workspace-local health marker directory
        run: mkdir -p "$BESZEL_HEALTH_DIR"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Verify pinned toolchain and source matrix
        shell: bash
        run: |
          set -euo pipefail
          expected_go="go$(awk '$1 == "go" { print $2; exit }' go.mod)"
          test "$(go version | awk '{print $3}')" = "$expected_go"
          test "$(bun --version)" = "1.4.0"
          python3 scripts/audit/validate-upstream-v021-matrix.py
          python3 scripts/audit/validate-upstream-v021-readiness.py

      - name: Test backup and restore failure cases
        shell: bash
        run: python3 -m unittest discover -s tests/hub-migration -p 'test_*.py' -v

      - name: Build genuine v0.19 fixture and reopen with v0.19
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/hub-migration/harness.py --output "$RUNNER_TEMP/p013-hub-fixture-evidence"

      - name: Upload synthetic fixture manifest only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p013-hub-recovery-evidence
          path: ${{ runner.temp }}/p013-hub-fixture-evidence/
          if-no-files-found: ignore
          retention-days: 14
