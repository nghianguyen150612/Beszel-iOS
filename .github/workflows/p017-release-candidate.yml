name: P017 Release Candidate Regression
# Cloud-only candidate validation. No signing, tags, release uploads or deployments.
on:
  pull_request:
    branches: [ios/upstream-v021-integration]
    paths:
      - '.github/workflows/p017-release-candidate.yml'
      - '.github/workflows/ios-build.yml'
      - '.github/scripts/**'
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'internal/site/**'
      - 'tests/**'
      - 'install.sh'
      - 'scripts/ios/**'
      - 'docs/ios-p019-*'
      - 'docs/ios-p020-*'
      - 'docs/ios-p021-*'
      - 'docs/ios-p022-*'
      - 'docs/ios-p023-*'
      - 'docs/ios-release-candidate*'
      - 'docs/ios-p017-*'
      - 'tests/ios-workflow-isolation-test.py'
      - 'scripts/audit/**'
      - 'patches/go/**'
      - 'install.sh'
      - 'scripts/ios/install-beszel.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p017-rc-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  candidate-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      BESZEL_HEALTH_DIR: ${{ github.workspace }}/.task/health
    steps:
      - name: Checkout candidate source, not the PR merge pseudo-commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Pinned Go toolchain from go.mod
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify native Go 1.27.3 x509 security fix
        shell: bash
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = go1.27.3
          python3 scripts/audit/validate-go-x509-native.py \
            --output "$RUNNER_TEMP/p023-go-x509-native.json"
      - name: Go standard-library and dependency vulnerability scan
        shell: bash
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          "$(go env GOPATH)/bin/govulncheck" -version
          "$(go env GOPATH)/bin/govulncheck" -format=json ./... > "$RUNNER_TEMP/p023-govulncheck.jsonl"
      - name: Bun 1.4.0
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Verify source provenance and frozen upstream ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(go version | awk '{print $3}')" = "go$(awk '$1 == "go" {print $2}' go.mod)"
          test "$(bun --version)" = 1.4.0
          git merge-base --is-ancestor bb23f99b3eeaced9608e11e280e7c986dba650be HEAD
          git merge-base --is-ancestor 3ed79af25a03381f4c1b8800fd7cb93e3480403d HEAD
          git diff --check
          python3 scripts/audit/validate-upstream-v021-matrix.py
          python3 scripts/audit/validate-upstream-v021-readiness.py
      - name: Prepare workspace-local health marker directory
        run: mkdir -p "$BESZEL_HEALTH_DIR"
      - name: Audit, bootstrap, installer and release isolation regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/audit -p 'test_*.py' -v
          python3 -m unittest discover -s tests/hub-migration -p 'test_*.py' -v
          sh tests/upstream-sync-test.sh
          sh tests/ios-patch-sentinels.sh
          sh tests/bootstrap-test.sh
          sh tests/install-sh-test.sh
          python3 tests/ios-workflow-isolation-test.py
          sh -n install.sh
          sh -n scripts/ios/install-beszel.sh
          printf '%s  %s\n' "$(sed -n 's/^engine_sha=//p' install.sh)" scripts/ios/install-beszel.sh | sha256sum -c -
      - name: Build genuine pinned frontend and check lockfile immutability
        shell: bash
        working-directory: internal/site
        run: |
          set -euo pipefail
          sha256sum bun.lock > "$RUNNER_TEMP/p017-lock.sha256"
          bun install --frozen-lockfile
          bun run sync
          bun test
          bun run build
          sha256sum -c "$RUNNER_TEMP/p017-lock.sha256"
          git restore -- src/locales
          git diff --exit-code
      - name: Audit installed Bun and npm dependency graphs
        shell: bash
        working-directory: internal/site
        run: |
          set +e
          bun audit --json --audit-level low \
            > "$RUNNER_TEMP/p023-bun-audit.json" \
            2> "$RUNNER_TEMP/p023-bun-audit.stderr.log"
          bun_status=$?
          npm audit --json --audit-level=low --package-lock-only \
            --fetch-retries=1 --fetch-timeout=30000 \
            > "$RUNNER_TEMP/p023-npm-audit.json" \
            2> "$RUNNER_TEMP/p023-npm-audit.stderr.log"
          npm_status=$?
          set -e
          python3 ../../scripts/audit/scan-p023-npm-lock-osv.py \
            --lockfile package-lock.json \
            --candidate-source-sha "$(git rev-parse HEAD)" \
            --request-output "$RUNNER_TEMP/p023-npm-osv-request.json" \
            --response-output "$RUNNER_TEMP/p023-npm-osv-response.json" \
            --output "$RUNNER_TEMP/p023-npm-osv-summary.json"
          python3 ../../scripts/audit/summarize-p023-js-audits.py \
            --bun-report "$RUNNER_TEMP/p023-bun-audit.json" --bun-exit-code "$bun_status" \
            --npm-report "$RUNNER_TEMP/p023-npm-audit.json" --npm-exit-code "$npm_status" \
            --npm-osv-report "$RUNNER_TEMP/p023-npm-osv-summary.json" \
            --candidate-source-sha "$(git rev-parse HEAD)" \
            --output "$RUNNER_TEMP/p023-js-audit-summary.json"
      - name: Upload P023 JavaScript dependency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p023-javascript-audit-evidence
          path: |
            ${{ runner.temp }}/p023-bun-audit.json
            ${{ runner.temp }}/p023-bun-audit.stderr.log
            ${{ runner.temp }}/p023-npm-audit.json
            ${{ runner.temp }}/p023-npm-audit.stderr.log
            ${{ runner.temp }}/p023-npm-osv-request.json
            ${{ runner.temp }}/p023-npm-osv-response.json
            ${{ runner.temp }}/p023-npm-osv-summary.json
            ${{ runner.temp }}/p023-js-audit-summary.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Verify OpenPGP package reachability
        shell: bash
        run: |
          set -euo pipefail
          go run .github/scripts/check-openpgp-imports.go \
            --root . --output "$RUNNER_TEMP/p023-openpgp-imports.json"
      - name: Validate exact Go scan and bounded advisory disposition
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit/validate-p023-govulncheck.py \
            --report "$RUNNER_TEMP/p023-govulncheck.jsonl" \
            --go-version "$(go env GOVERSION)" \
            --candidate-source-sha "$(git rev-parse HEAD)" \
            --x509-evidence "$RUNNER_TEMP/p023-go-x509-native.json" \
            --openpgp-evidence "$RUNNER_TEMP/p023-openpgp-imports.json" \
            --output "$RUNNER_TEMP/p023-govulncheck-summary.json"
      - name: Upload P023 Go vulnerability and reachability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p023-go-vulnerability-evidence
          path: |
            ${{ runner.temp }}/p023-govulncheck.jsonl
            ${{ runner.temp }}/p023-govulncheck-summary.json
            ${{ runner.temp }}/p023-go-x509-native.json
            ${{ runner.temp }}/p023-openpgp-imports.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Full canonical Go regression and portable builds
        shell: bash
        run: |
          set -euo pipefail
          # Agent and Hub tests share the process-health marker path. Run all
          # package test binaries serially so cleanup in one package cannot
          # invalidate another package's liveness assertions.
          env -u NETWORK go test -p 1 -tags 'testing no_ui' ./... -count=1 -timeout=20m
          env -u NETWORK go build -tags 'no_ui' -o "$RUNNER_TEMP/p017-agent" ./internal/cmd/agent
          env -u NETWORK go build -tags 'no_ui' -o "$RUNNER_TEMP/p017-hub" ./internal/cmd/hub
      - name: Record source and frontend manifest (not a native iOS artifact)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root=pathlib.Path('internal/site/dist')
          files=sorted(p for p in root.rglob('*') if p.is_file())
          assert files and (root/'index.html').is_file(), 'Missing genuine frontend assets'
          h=hashlib.sha256()
          for p in files:
              rel=p.relative_to(root).as_posix().encode()
              data=p.read_bytes()
              h.update(len(rel).to_bytes(4,'big')+rel+len(data).to_bytes(8,'big')+data)
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          result={'schema':1,'kind':'P017 regression evidence; NOT a release candidate native iOS binary','candidate_source_sha':sha,'frontend_asset_count':len(files),'frontend_asset_manifest_sha256':h.hexdigest(),'device_tested':False,'release_published':False,'tag_created':False}
          pathlib.Path(os.environ['RUNNER_TEMP'],'p017-regression.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          PY
      - name: Upload candidate regression manifest only
        uses: actions/upload-artifact@v4
        with:
          name: p017-regression-manifest
          path: ${{ runner.temp }}/p017-regression.json
          if-no-files-found: error
          retention-days: 14
