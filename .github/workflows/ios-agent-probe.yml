name: iOS Agent Probe

on:
  workflow_dispatch:

jobs:
  build-ios-agent:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Patch Go runtime for legacy iOS ARM64
        run: sudo python3 .github/scripts/patch-go-ios-arm64-runtime.py

      - name: Show environment
        run: |
          go version
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --find clang

      - name: Create iOS clang wrapper
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ios-clangwrap.sh" <<'WRAP'
          #!/bin/sh
          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          CLANG="$(xcrun --sdk iphoneos --find clang)"

          exec "$CLANG" \
            -arch arm64 \
            -isysroot "$SDK_PATH" \
            -mios-version-min=12.0 \
            "$@"
          WRAP

          chmod +x "$RUNNER_TEMP/ios-clangwrap.sh"

      - name: Build Beszel agent for iOS arm64
        shell: bash
        run: |
          mkdir -p build

          CGO_ENABLED=1 \
          GOOS=ios \
          GOARCH=arm64 \
          CC="$RUNNER_TEMP/ios-clangwrap.sh" \
          go build \
            -trimpath \
            -ldflags="-s -w" \
            -o build/beszel-agent-ios-arm64 \
            ./internal/cmd/agent

      - name: Inspect binary
        run: |
          file build/beszel-agent-ios-arm64
          otool -hv build/beszel-agent-ios-arm64
          otool -l build/beszel-agent-ios-arm64 | grep -A8 -E 'LC_BUILD_VERSION|LC_VERSION_MIN_IPHONEOS'

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: beszel-agent-ios-arm64
          path: build/beszel-agent-ios-arm64
